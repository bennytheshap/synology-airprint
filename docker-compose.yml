version: '3.5'

services:
  airprint:
    container_name: airprint
    build: https://github.com/bennytheshap/synology-airprint.git
    restart: always
    network_mode: "host"
    environment:
      CUPSADMIN: admin
      CUPSPASSWORD: admin
    volumes:
      - "./services:/services"
      - "./config:/config"
